name: Agent Handoff

# This is a state coordinator, NOT an LLM executor or Codex integration.
# workflow_run uses the workflow from the default branch; do not run PR code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number
      dry_run:
        description: Evaluate without writing a PR comment
        required: true
        default: true
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: agent-handoff-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  state:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/agent status')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch coordinator only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate CI, review and durable state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--pr "$PR_NUMBER")
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            args+=(--run-id "$CI_RUN_ID")
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/agent_handoff.py "${args[@]}"
