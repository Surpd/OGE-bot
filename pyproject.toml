[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "oge-trainer"
version = "0.1.0"
description = "Private Telegram foundation for OGE mathematics practice"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "Pillow==12.3.0",
  "matplotlib==3.11.2",
  "uvicorn[standard]==0.35.0",
  "openai==3.57.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/math/oge19_bank.json" = "app/math/oge19_bank.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["mass: high-volume seed, diversity, stress or raster QA (also included in full pytest)"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["specs/research/oge14_generator_v3"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
