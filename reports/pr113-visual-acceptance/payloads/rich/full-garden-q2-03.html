<p><b>Участки</b></p><p> </p><p><b>Задание №2 из 5</b></p><p> </p><p>Сколько пачек плитки нужно для дорожек и прямоугольной площадки у ворот? Сторона клетки плана 2 м, ширина дорожки 1 м, размер плитки <tg-math>1 \times 1</tg-math> м. В пачке 13 плиток. Покрытие укладывают без зазоров.</p><p> </p><p>Напиши ответ в чат.</p>
